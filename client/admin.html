<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <h3 class="text-white">Student Course Registration System</h3>

        <button class="btn btn-light" id="logoutBtn">
            Logout
        </button>
    </div>
</nav>

<div class="container mt-4">

    <!-- Dashboard -->
    <div class="row text-center">

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Total Students</h5>
                <h2 id="totalStudents">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Total Courses</h5>
                <h2 id="totalCourses">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h5>Registrations</h5>
                <h2 id="totalRegistrations">0</h2>
            </div>
        </div>

    </div>

    <hr>

    <!-- Student -->

    <div class="d-flex justify-content-between mb-3">

        <h3>Students</h3>

        <button class="btn btn-success" id="addStudentBtn">
            Add Student
        </button>

    </div>

    <table class="table table-bordered">

        <thead class="table-dark">

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

    <hr>

    <!-- Course -->

    <div class="d-flex justify-content-between mb-3">

        <h3>Courses</h3>

        <button class="btn btn-primary" id="addCourseBtn">
            Add Course
        </button>

    </div>

    <table class="table table-bordered">

        <thead class="table-primary">

        <tr>
            <th>Course Code</th>
            <th>Course Name</th>
            <th>Credit</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="courseTable">

        </tbody>

    </table>

    <hr>

    <!-- Registration -->

    <div class="d-flex justify-content-between mb-3">

        <h3>Registrations</h3>

        <button class="btn btn-warning" id="addRegistrationBtn">
            Register Course
        </button>

    </div>

    <table class="table table-bordered">

        <thead class="table-success">

        <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="registrationTable">

        </tbody>

    </table>

</div>

<script src="api.js"></script>
<script src="script.js"></script>

</body>
</html>
