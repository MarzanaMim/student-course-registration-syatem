<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">
            Student Course Registration System
        </span>

        <div>
            <span id="userRole" class="text-white me-3"></span>

            <button class="btn btn-light btn-sm" onclick="logout()">
                Logout
            </button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Dashboard
    </h2>

    <!-- Search -->

    <div class="row mb-4">

        <div class="col-md-6">

            <input
                    type="text"
                    id="search"
                    class="form-control"
                    placeholder="Search Student..."
            >

        </div>

        <div class="col-md-2">

            <button
                    class="btn btn-primary w-100"
                    onclick="searchStudent()">

                Search

            </button>

        </div>

    </div>

    <!-- Student Form -->

    <div class="card mb-4">

        <div class="card-header bg-success text-white">

            Student Form

        </div>

        <div class="card-body">

            <input type="hidden" id="studentId">

            <div class="row">

                <div class="col-md-3 mb-3">

                    <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Student Name">

                </div>

                <div class="col-md-3 mb-3">

                    <input
                            type="text"
                            id="studentIdNo"
                            class="form-control"
                            placeholder="Student ID">

                </div>

                <div class="col-md-3 mb-3">

                    <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Email">

                </div>

                <div class="col-md-3 mb-3">

                    <input
                            type="text"
                            id="department"
                            class="form-control"
                            placeholder="Department">

                </div>

            </div>

            <button
                    class="btn btn-success"
                    onclick="saveStudent()">

                Save

            </button>

            <button
                    class="btn btn-warning"
                    onclick="updateStudent()">

                Update

            </button>

            <button
                    class="btn btn-secondary"
                    onclick="clearForm()">

                Clear

            </button>

        </div>

    </div>

    <!-- Student Table -->

    <div class="card mb-4">

        <div class="card-header bg-dark text-white">

            Student List

        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>Name</th>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Course -->

    <div class="card mb-4">

        <div class="card-header bg-info text-white">

            Course Management

        </div>

        <div class="card-body">

            <p>
                Course CRUD will be connected in next step.
            </p>

        </div>

    </div>

    <!-- Registration -->

    <div class="card mb-4">

        <div class="card-header bg-warning">

            Course Registration

        </div>

        <div class="card-body">

            <p>
                Registration CRUD will be connected in next step.
            </p>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/script.js"></script>

</body>
</html>
